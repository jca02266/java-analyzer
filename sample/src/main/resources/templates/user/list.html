<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User List</title>
</head>
<body>
    <h1>User List</h1>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="user : ${users}">
                <td th:text="${user.id}">1</td>
                <td th:text="${user.name}">John</td>
                <td>
                    <a th:href="@{/user/{id}(id=${user.id})}">View</a> |
                    <a th:href="@{/user/{id}/edit(id=${user.id})}">Edit</a> |
                    <a th:href="@{/user/{id}/delete(id=${user.id})}">Delete</a>
                </td>
            </tr>
        </tbody>
    </table>

    <div>
        <a th:href="@{/user/create}">Create New User</a>
    </div>

    <script src="/js/app.js"></script>
    <script>
        // Inline script for searching users
        document.addEventListener('DOMContentLoaded', function() {
            const searchButton = document.getElementById('searchBtn');
            if (searchButton) {
                searchButton.addEventListener('click', function() {
                    const query = document.getElementById('searchInput').value;
                    fetch('/api/users/search?q=' + encodeURIComponent(query))
                        .then(response => response.json())
                        .then(data => console.log(data));
                });
            }
        });
    </script>
</body>
</html>
